<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Homework</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main>

    <h1>CSS Homework</h1>

    <section>
        <h2>1. Button Hover</h2>
        <button>Hover Me</button>
    </section>

    <br>

    <section>
        <h2>2. Moving Box</h2>
        <div class="move-area">
            <div class="box"></div>
        </div>
    </section>

    <br>

    <section>
        <h2>3. Loading Spinner</h2>
        <div class="spinner"></div>
    </section>

    <br>

    <section>
        <h2>4. Flip Card</h2>

        <article class="card">
            <div class="card-inner">

                <div class="card-front">
                    Front
                </div>

                <div class="card-back">
                    Back
                </div>

            </div>
        </article>
    </section>

    <br>

    <section>
        <h2>5. Image Caption</h2>

        <figure class="image-box">
            <img src="https://picsum.photos/300/200" alt="Example">

            <figcaption>
                Beautiful Image
            </figcaption>
        </figure>
    </section>

</main>

</body>
</html>
